// 驗證總題數
const TOTAL_Q = TOPICS.reduce((s, t) => s + t.questions.length, 0); // 應為 40

// ============================================================
// localStorage 工具
// ============================================================
const LS_KEY = "smmc_w13_quiz_state_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) { return defaultState(); }
}
function defaultState() {
  return {
    profile: { name: "", studentId: "", email: "" },
    lang: "zh", // zh | en | both
    theme: "light",
    // 每題的歷程：{ topicId, qIdx, attempts: [{correct, timeSec, ts, chosen}] }
    attempts: {},   // key = `${topicId}:${qIdx}` → array of attempts
    sessions: [],   // 每次主題測驗的整體結果摘要
  };
}
function saveState(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
}

// ============================================================
// 主程式
// ============================================================
function App() {
  const [state, setState] = useState(loadState());
  const [view, setView] = useState("home"); // home | profile | quiz | result | dashboard
  const [activeTopic, setActiveTopic] = useState(null);
  const [quizSession, setQuizSession] = useState(null); // 當前測驗會話

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => {
    document.documentElement.classList.toggle("dark", state.theme === "dark");
  }, [state.theme]);

  const lang = state.lang;
  const t = (zh, en) => lang === "en" ? en : lang === "both" ? `${zh} / ${en}` : zh;

  // 啟動主題測驗
  function startQuiz(topic) {
    setActiveTopic(topic);
    setQuizSession({
      topicId: topic.id,
      startTs: Date.now(),
      qStartTs: Date.now(),
      curIdx: 0,
      answers: new Array(topic.questions.length).fill(null), // {chosen, timeSec}
    });
    setView("quiz");
  }

  function recordAnswer(idx, chosen, timeSec) {
    const topic = activeTopic;
    const q = topic.questions[idx];
    const correct = chosen === q.answer;
    const key = `${topic.id}:${idx}`;
    setState(s => {
      const arr = s.attempts[key] ? [...s.attempts[key]] : [];
      arr.push({ correct, timeSec, ts: Date.now(), chosen });
      return { ...s, attempts: { ...s.attempts, [key]: arr } };
    });
  }

  function submitQuiz() {
    const topic = activeTopic;
    const answers = quizSession.answers;
    let correctCount = 0;
    answers.forEach((a, i) => {
      if (a && a.chosen === topic.questions[i].answer) correctCount++;
    });
    const totalTime = Math.round((Date.now() - quizSession.startTs) / 1000);
    const summary = {
      topicId: topic.id,
      ts: Date.now(),
      correctCount,
      total: topic.questions.length,
      totalTimeSec: totalTime,
      answersSnap: answers,
    };
    setState(s => ({ ...s, sessions: [...s.sessions, summary] }));
    setQuizSession({ ...quizSession, finished: true, summary });
    setView("result");
  }

  function retryQuiz() {
    startQuiz(activeTopic);
  }

  function nextTopic() {
    const idx = TOPICS.findIndex(t => t.id === activeTopic.id);
    if (idx < TOPICS.length - 1) {
      startQuiz(TOPICS[idx + 1]);
    } else {
      setView("dashboard");
    }
  }

  // ====== 各分頁 ======
  return (
    <div className="min-h-screen">
      <Header state={state} setState={setState} setView={setView} lang={lang} t={t} />
      <div className="max-w-6xl mx-auto px-4 sm:px-6 pb-20">
        {view === "home" && <Home state={state} t={t} onStart={startQuiz} setView={setView} />}
        {view === "profile" && <Profile state={state} setState={setState} setView={setView} t={t} />}
        {view === "quiz" && quizSession && activeTopic && (
          <Quiz
            topic={activeTopic}
            session={quizSession}
            setSession={setQuizSession}
            recordAnswer={recordAnswer}
            submitQuiz={submitQuiz}
            t={t} lang={lang}
            cancel={() => setView("home")}
          />
        )}
        {view === "result" && quizSession?.finished && activeTopic && (
          <Result
            topic={activeTopic}
            summary={quizSession.summary}
            session={quizSession}
            onRetry={retryQuiz}
            onNext={nextTopic}
            onHome={() => setView("home")}
            onDashboard={() => setView("dashboard")}
            t={t} lang={lang}
          />
        )}

function computeTopicStats(state, topics) {
  const r = {};
  topics.forEach(tp => {
    let attempted = 0;
    let lastCorrect = 0;
    tp.questions.forEach((_, qi) => {
      const arr = state.attempts[`${tp.id}:${qi}`];
      if (arr && arr.length > 0) {
        attempted++;
        if (arr[arr.length - 1].correct) lastCorrect++;
      }
    });
    r[tp.id] = {
      attempted,
      lastAccuracy: attempted > 0 ? lastCorrect / attempted : 0,
    };
  });
  return r;
}

// Quiz
// ============================================================
function Quiz({ topic, session, setSession, recordAnswer, submitQuiz, t, lang, cancel }) {
  const q = topic.questions[session.curIdx];
  const cur = session.answers[session.curIdx];
  const [reveal, setReveal] = useState(false);

  useEffect(() => {
    setReveal(false);
    setSession(s => ({ ...s, qStartTs: Date.now() }));
  }, [session.curIdx]);

  function choose(i) {
    if (reveal) return;
    const timeSec = Math.round((Date.now() - session.qStartTs) / 1000);
    const newAnswers = [...session.answers];
    newAnswers[session.curIdx] = { chosen: i, timeSec };
    setSession(s => ({ ...s, answers: newAnswers }));
    recordAnswer(session.curIdx, i, timeSec);
    setReveal(true);
  }

  function go(delta) {
    const newIdx = session.curIdx + delta;
    if (newIdx < 0 || newIdx >= topic.questions.length) return;
    setSession(s => ({ ...s, curIdx: newIdx }));
  }

  const allAnswered = session.answers.every(a => a !== null);
  const progress = (session.curIdx + 1) / topic.questions.length;

  return (
    <div className="pt-6">
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="text-xs" style={{ color: "var(--bcg-mute)" }}>{t(topic.titleZh, topic.titleEn)}</div>
          <div className="text-lg font-semibold">
            {t("第", "Question")} {session.curIdx + 1} / {topic.questions.length}
          </div>
        </div>
        <button className="text-xs underline" onClick={cancel} style={{ color: "var(--bcg-mute)" }}>
          {t("退出本主題", "Exit topic")}
        </button>
      </div>
      <div className="progress-bar mb-6"><div className="progress-fill" style={{ width: `${progress * 100}%` }}></div></div>

      <div className="bcg-card p-6 mb-4">
        <div className="text-base font-medium mb-1">
          {lang === "both" ? (
            <>
              <div>{q.q.zh}</div>
              <div className="text-sm mt-1" style={{ color: "var(--bcg-mute)" }}>{q.q.en}</div>
            </>
          ) : lang === "en" ? q.q.en : q.q.zh}
        </div>

        <div className="space-y-2 mt-5">
          {q.opts.map((opt, i) => {
            const isChosen = cur && cur.chosen === i;
            const isCorrect = i === q.answer;
            let cls = "opt";
            if (reveal) {
              if (isCorrect) cls += " correct";
              else if (isChosen) cls += " wrong";
            } else if (isChosen) cls += " selected";
            return (
              <div key={i} className={cls} onClick={() => choose(i)}>
                <div className="flex items-start gap-2">
                  <div className="font-semibold" style={{ minWidth: 22 }}>{String.fromCharCode(65 + i)}.</div>
                  <div className="flex-1">
                    {lang === "both" ? (
                      <>
                        <div>{opt.zh}</div>
                        <div className="text-xs mt-0.5" style={{ color: "var(--bcg-mute)" }}>{opt.en}</div>
                      </>
                    ) : lang === "en" ? opt.en : opt.zh}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {reveal && (
          <div className="mt-5 p-4 rounded-lg" style={{ background: cur.chosen === q.answer ? "rgba(47,125,79,0.08)" : "rgba(179,38,30,0.06)", border: "1px solid var(--bcg-line)" }}>
            <div className="text-sm font-semibold mb-1" style={{ color: cur.chosen === q.answer ? "var(--ok)" : "var(--bad)" }}>
              {cur.chosen === q.answer ? t("答對了！", "Correct!") : t("答錯了", "Incorrect")}
            </div>
            <div className="text-sm">
              {lang === "both" ? (
                <>
                  <div>{q.explain.zh}</div>
                  <div className="text-xs mt-1" style={{ color: "var(--bcg-mute)" }}>{q.explain.en}</div>
                </>
              ) : lang === "en" ? q.explain.en : q.explain.zh}
            </div>
            <div className="text-xs mt-2" style={{ color: "var(--bcg-mute)" }}>⏱ {cur.timeSec}s</div>
          </div>
        )}
      </div>

      <div className="flex justify-between items-center">
        <button className="bcg-btn-ghost" onClick={() => go(-1)} disabled={session.curIdx === 0}>← {t("上一題", "Prev")}</button>
        <div className="text-xs" style={{ color: "var(--bcg-mute)" }}>
          {t("已作答", "Answered")}: {session.answers.filter(a => a !== null).length} / {topic.questions.length}
        </div>
        {session.curIdx < topic.questions.length - 1 ? (
          <button className="bcg-btn" onClick={() => go(1)}>{t("下一題", "Next")} →</button>
        ) : (
          <button className="bcg-btn" onClick={submitQuiz} disabled={!allAnswered}>
            {t("送出", "Submit")} ✓
          </button>
        )}
      </div>
    </div>
  );
}

// Dashboard
// ============================================================
function Dashboard({ state, setState, t, setView }) {
  const overall = useMemo(() => {
    let totalAttempts = 0, totalCorrect = 0, totalTime = 0;
    Object.values(state.attempts).forEach(arr => {
      arr.forEach(a => {
        totalAttempts++;
        if (a.correct) totalCorrect++;
        totalTime += a.timeSec || 0;
      });
    });
    return {
      totalAttempts, totalCorrect, totalTime,
      accuracy: totalAttempts ? totalCorrect / totalAttempts : 0,
      avgTime: totalAttempts ? totalTime / totalAttempts : 0,
    };
  }, [state.attempts]);

  // 每題的詳細：attempts 數、accuracy、平均時間、上次答題狀態
  const perQuestion = useMemo(() => {
    const rows = [];
    TOPICS.forEach(topic => {
      topic.questions.forEach((q, qi) => {
        const arr = state.attempts[`${topic.id}:${qi}`] || [];
        const correct = arr.filter(a => a.correct).length;
        const avgT = arr.length ? arr.reduce((s, a) => s + a.timeSec, 0) / arr.length : 0;
        rows.push({
          topicId: topic.id,
          topicLabel: topic.titleZh,
          qIdx: qi,
          qLabel: q.q.zh.slice(0, 40) + (q.q.zh.length > 40 ? "…" : ""),
          attempts: arr.length,
          accuracy: arr.length ? correct / arr.length : 0,
          avgTime: avgT,
          lastCorrect: arr.length ? arr[arr.length - 1].correct : null,
        });
      });
    });
    return rows;
  }, [state.attempts]);

  // 各主題正確率演進（依 session）
  const topicEvolution = useMemo(() => {
    const map = {};
    TOPICS.forEach(t => { map[t.id] = []; });
    state.sessions.forEach(s => {
      if (map[s.topicId]) {
        map[s.topicId].push({
          ts: s.ts,
          accuracy: s.correctCount / s.total,
          time: s.totalTimeSec,
        });
      }
    });
    return map;
  }, [state.sessions]);

  function exportCSV() {
    const rows = [];
    rows.push(["section", "field1", "field2", "field3", "field4", "field5", "field6"]);
    rows.push(["profile", "name", state.profile.name || "", "studentId", state.profile.studentId || "", "email", state.profile.email || ""]);
    rows.push([]);
    rows.push(["per_question", "topic", "qIdx", "attempts", "accuracy", "avgTimeSec", "lastCorrect"]);
    perQuestion.forEach(r => {
      rows.push(["per_question", r.topicLabel, r.qIdx + 1, r.attempts, r.accuracy.toFixed(3), r.avgTime.toFixed(1), r.lastCorrect === null ? "" : r.lastCorrect]);
    });
    rows.push([]);
    rows.push(["session", "topic", "ts", "correctCount", "total", "accuracy", "totalTimeSec"]);
    state.sessions.forEach(s => {
      const tp = TOPICS.find(t => t.id === s.topicId);
      rows.push(["session", tp?.titleZh || s.topicId, new Date(s.ts).toISOString(), s.correctCount, s.total, (s.correctCount / s.total).toFixed(3), s.totalTimeSec]);
    });
    rows.push([]);
    rows.push(["raw_attempt", "topic", "qIdx", "correct", "timeSec", "ts", "chosen"]);
    Object.entries(state.attempts).forEach(([k, arr]) => {
      const [tid, qi] = k.split(":");
      const tp = TOPICS.find(t => t.id === tid);
      arr.forEach(a => {
        rows.push(["raw_attempt", tp?.titleZh || tid, Number(qi) + 1, a.correct, a.timeSec, new Date(a.ts).toISOString(), a.chosen]);
      });
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url; a.download = `SMMC_W13_Quiz_${state.profile.studentId || "anon"}_${stamp}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll() {
    if (confirm(t("確定要清除所有作答紀錄？此動作無法復原。", "Clear all attempt records? This cannot be undone."))) {
      setState(s => ({ ...s, attempts: {}, sessions: [] }));
    }
  }

  return (
    <div className="pt-6">
      <div className="flex flex-wrap items-center gap-2 mb-5">
        <h2 className="text-xl font-semibold flex-1" style={{ color: "var(--bcg-green)" }}>{t("學習儀表板", "Learning Dashboard")}</h2>
        <button className="bcg-btn" onClick={exportCSV}>⤓ {t("匯出 CSV", "Export CSV")}</button>
        <button className="bcg-btn-ghost" onClick={resetAll}>{t("清除紀錄", "Reset")}</button>
      </div>

      {state.profile.name && (
        <div className="bcg-card p-4 mb-4 text-sm">
          <span style={{ color: "var(--bcg-mute)" }}>{t("作答者", "Learner")}：</span>
          <span className="font-medium">{state.profile.name}</span>
          {state.profile.studentId && <span className="ml-3" style={{ color: "var(--bcg-mute)" }}>ID: {state.profile.studentId}</span>}
          {state.profile.email && <span className="ml-3" style={{ color: "var(--bcg-mute)" }}>{state.profile.email}</span>}
        </div>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <StatBox label={t("總作答次數", "Total Attempts")} value={overall.totalAttempts} />
        <StatBox label={t("整體正確率", "Overall Accuracy")} value={`${Math.round(overall.accuracy * 100)}%`} />
        <StatBox label={t("總花費時間", "Total Time")} value={fmtTime(overall.totalTime)} />
        <StatBox label={t("平均每題時間", "Avg Time/Q")} value={`${overall.avgTime.toFixed(1)}s`} />
      </div>

      <div className="bcg-card p-5 mb-6">
        <div className="font-semibold mb-3">{t("各主題正確率演進", "Accuracy Evolution per Topic")}</div>
        <div className="space-y-3">
          {TOPICS.map(tp => {
            const ev = topicEvolution[tp.id];
            if (ev.length === 0) {
              return (
                <div key={tp.id} className="text-xs flex items-center gap-3">
                  <div style={{ minWidth: 160 }}>{tp.titleZh}</div>
                  <div style={{ color: "var(--bcg-mute)" }}>{t("尚未測驗", "Not yet attempted")}</div>
                </div>
              );
            }
            return <SparkRow key={tp.id} label={tp.titleZh} points={ev} t={t} />;
          })}
        </div>
      </div>

      <div className="bcg-card p-5 mb-6">
        <div className="font-semibold mb-3">{t("各題練習紀錄", "Per-Question Practice Record")}</div>
        <div className="overflow-x-auto">
          <table className="kb">
            <thead>
              <tr>
                <th>{t("主題", "Topic")}</th>
                <th>#</th>
                <th>{t("題目（摘）", "Question (snippet)")}</th>
                <th>{t("作答次數", "Attempts")}</th>
                <th>{t("正確率", "Accuracy")}</th>
                <th>{t("平均時間", "Avg Time")}</th>
                <th>{t("上次", "Last")}</th>
              </tr>
            </thead>
            <tbody>
              {perQuestion.map((r, i) => (
                <tr key={i}>
                  <td className="text-xs">{r.topicLabel}</td>
                  <td>{r.qIdx + 1}</td>
                  <td className="text-xs">{r.qLabel}</td>
                  <td>{r.attempts}</td>
                  <td>{r.attempts > 0 ? `${Math.round(r.accuracy * 100)}%` : "—"}</td>
                  <td>{r.attempts > 0 ? `${r.avgTime.toFixed(1)}s` : "—"}</td>
                  <td>
                    {r.lastCorrect === null ? "—" : r.lastCorrect ? <span style={{ color: "var(--ok)" }}>✓</span> : <span style={{ color: "var(--bad)" }}>✗</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="bcg-card p-5">
        <div className="font-semibold mb-3">{t("測驗會話紀錄", "Session History")}</div>
        {state.sessions.length === 0 ? (
          <div className="text-sm" style={{ color: "var(--bcg-mute)" }}>{t("尚無測驗紀錄。", "No sessions yet.")}</div>
        ) : (
          <table className="kb">
            <thead>
              <tr>
                <th>{t("時間", "Time")}</th>
                <th>{t("主題", "Topic")}</th>
                <th>{t("成績", "Score")}</th>
                <th>{t("正確率", "Accuracy")}</th>
                <th>{t("耗時", "Duration")}</th>
              </tr>
            </thead>
            <tbody>
              {[...state.sessions].reverse().map((s, i) => {
                const tp = TOPICS.find(t => t.id === s.topicId);
                return (
                  <tr key={i}>
                    <td className="text-xs">{new Date(s.ts).toLocaleString()}</td>
                    <td className="text-xs">{tp?.titleZh}</td>
                    <td>{s.correctCount}/{s.total}</td>
                    <td>{Math.round(s.correctCount / s.total * 100)}%</td>
                    <td>{fmtTime(s.totalTimeSec)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function StatBox({ label, value }) {
  return (
    <div className="bcg-card p-4 text-center">
      <div className="stat-num">{value}</div>
      <div className="text-xs mt-1" style={{ color: "var(--bcg-mute)" }}>{label}</div>
    </div>
  );
}

function SparkRow({ label, points, t }) {
  // points: [{ts, accuracy, time}]
  const W = 280, H = 36, PAD = 4;
  const max = 1, min = 0;
  const xs = points.map((_, i) => PAD + i * ((W - 2 * PAD) / Math.max(points.length - 1, 1)));
  const ys = points.map(p => PAD + (1 - (p.accuracy - min) / (max - min)) * (H - 2 * PAD));
  const path = points.map((_, i) => `${i === 0 ? "M" : "L"} ${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return (
    <div className="flex items-center gap-3 text-xs">
      <div style={{ minWidth: 160 }}>{label}</div>
      <svg width={W} height={H} style={{ flexShrink: 0 }}>
        <line x1={PAD} y1={H / 2} x2={W - PAD} y2={H / 2} stroke="var(--bcg-line)" strokeWidth="0.5" strokeDasharray="2 2" />
        <path d={path} fill="none" stroke="var(--bcg-green)" strokeWidth="1.5" />
        {points.map((p, i) => (
          <circle key={i} cx={xs[i]} cy={ys[i]} r="3" fill={p.accuracy >= 0.6 ? "var(--bcg-green)" : "#b3261e"} />
        ))}
      </svg>
      <div style={{ color: "var(--bcg-mute)" }}>
        n={points.length} · {t("最新", "latest")} {Math.round(last.accuracy * 100)}%
      </div>
    </div>
  );
}

function fmtTime(s) {
  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60), ss = Math.round(s % 60);
  return `${m}m ${ss}s`;
}

// ============================================================
// Footer
// ============================================================
function Footer({ t }) {
  return (
    <footer className="border-t mt-10 py-4 text-xs text-center" style={{ borderColor: "var(--bcg-line)", color: "var(--bcg-mute)" }}>
      SMMC-EMI · Week 13 · NCNU IBS · {t("資料儲存於本機 localStorage", "Data stored locally in your browser")}
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
